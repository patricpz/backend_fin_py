[project]
name = "backend-fin-py"
version = "0.1.0"
description = "Backend financeiro pessoal - FastAPI + SQLAlchemy 2.x + PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "pydantic-extra-types>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pwdlib[argon2]>=0.1.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "faker>=25.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RSE", "RET", "ARG", "ASYNC", "Q", "ICN", "INP", "PIE", "TCH", "TID", "PT", "FLY"]
ignore = ["S101", "S106", "S306", "S311", "S404", "S603", "S607"]
per-file-ignores = { "tests/*" = ["S101", "PLR2004", "PLR0913", "ARG", "RET", "PT011"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]